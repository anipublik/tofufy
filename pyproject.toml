[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tofufy"
version = "0.1.0"
description = "TFE to OpenTofu. The whole thing, not just the code."
readme = "docs/README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ani Sridharan" }]
keywords = ["terraform", "opentofu", "migration", "infrastructure", "iac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-hcl2>=4",
    "pydantic>=2",
    "httpx>=0.27",
    "pyyaml>=6",
    "jinja2>=3",
]

[project.scripts]
tofufy = "tofufy.cli.root:app"

[project.urls]
Homepage = "https://github.com/anipublik/tofufy"
Repository = "https://github.com/anipublik/tofufy"
Issues = "https://github.com/anipublik/tofufy/issues"
Changelog = "https://github.com/anipublik/tofufy/releases"

[project.optional-dependencies]
# AI-assisted refinement (BYOK). Heavy dep, optional.
ai = ["litellm>=1.40"]
# PR creation on GitHub / GitLab / Bitbucket.
git = ["PyGithub>=2", "gitpython>=3"]
# Cloud state-backend adapters.
s3 = ["boto3>=1.34"]
gcs = ["google-cloud-storage>=2"]
# All optional integrations bundled.
all = [
    "litellm>=1.40",
    "PyGithub>=2",
    "gitpython>=3",
    "boto3>=1.34",
    "google-cloud-storage>=2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2",
    "pyinstaller>=6",
    "respx>=0.21",
    "types-pyyaml>=6",
    # Optional-integration deps needed for full test coverage.
    "litellm>=1.40",
    "PyGithub>=2",
    "gitpython>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tofufy"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "PT",   # flake8-pytest-style
    "ARG",  # unused arguments
]
ignore = [
    "E501",    # line length (handled by formatter when used)
    "ARG001",  # unused function args (typer callbacks need them)
    "ARG002",  # unused method args (Rule.apply signature)
    "RET504",  # named-return-before-return is often a readability win
    "PTH201",  # Path(".") default - typer needs concrete defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PT011", "SIM117", "TC003", "PT018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=tofufy --cov-report=term-missing --cov-fail-under=60 --strict-markers -ra"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/tofufy"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "\\.\\.\\.",
]
