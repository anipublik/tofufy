[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tofufy"
version = "0.1.0"
description = "TFE to OpenTofu. The whole thing, not just the code."
readme = "docs/README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ani Sridharan" }]
keywords = ["terraform", "opentofu", "migration", "infrastructure", "iac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "python-hcl2>=4",
    "pydantic>=2",
    "httpx>=0.27",
    "PyGithub>=2",
    "gitpython>=3",
    "litellm>=1.40",
]

[project.scripts]
tofufy = "tofufy.cli.root:app"

[project.urls]
Homepage = "https://github.com/anipublik/tofufy"
Repository = "https://github.com/anipublik/tofufy"
Issues = "https://github.com/anipublik/tofufy/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2",
    "pyinstaller>=6",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tofufy"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=tofufy --cov-report=term-missing --cov-fail-under=0"

[tool.coverage.run]
source = ["src/tofufy"]
